<rect x="1020" y="150" width="188" height="6" rx="3" fill="#A98BFF" filter="url(#gs)"><animate attributeName="width" from="0" to="188" dur="1.6s" begin="0.8s" fill="freeze"/></rect>
<rect width="1280" height="190" rx="16" fill="url(#sc)"/>
<rect x="1" y="1" width="1278" height="188" rx="15" fill="none" stroke="#00F0FF" stroke-opacity=".35" filter="url(#gs)"/></svg>